<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모두의장부</title>
<meta name="description" content="타코집 원가·가계부. 메뉴별 재료비와 남는 돈, 하루·한 달 장부를 브라우저 하나로.">
<meta name="theme-color" content="#17231C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F0;--card:#fff;--ink:#17231C;--ink2:#31453A;--mut:#5B6B62;--line:#D5DDD6;--line2:#E3E9E4;--ib:#B9C5BC;--chip:#E8EEE9;
  --g:#137A4B;--gbg:#E3F1E8;--gbar:#C5DECE;--r:#C0392B;--rbg:#FBE9E5;--rtx:#8A2E20;--y:#E0A100;--ybg:#FFF1D6;--ytx:#8A5A00;
  --o:#D9480F;--otx:#B93A0A;--gray:#5F6B66;--graybg:#E9ECEA;--note:#8A4B00;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:17px;line-height:1.45}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
button{white-space:nowrap;cursor:pointer}
a{color:var(--ink2)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 24px 72px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.col{display:flex;flex-direction:column;gap:2px}
.mut{color:var(--mut)}
.pos{color:var(--g)}.neg{color:var(--r)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.logo{font-size:28px;font-weight:900}
.status{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut)}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--g)}
.status.bad{color:var(--r);font-weight:700}.status.bad .dot{background:var(--r)}
.status.wait .dot{background:var(--ib)}
.topbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 22px}
.tb-lbl{font-size:14px;color:var(--mut);white-space:nowrap}
.tb-big{font-size:30px;font-weight:900;line-height:1.1;white-space:nowrap}
.vsep{width:1px;height:48px;background:var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
details.sp{position:relative}
.pill{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;white-space:nowrap;font-size:15px;font-weight:700}
.pill::-webkit-details-marker{display:none}
.pill .dot{width:10px;height:10px;border-radius:50%}
.pill-red{background:var(--rbg);color:var(--r)}.pill-red .dot{background:var(--r)}
.pill-yellow{background:var(--ybg);color:var(--ytx)}.pill-yellow .dot{background:var(--y)}
.pill-zero{background:var(--graybg);color:var(--gray)}.pill-zero .dot{background:var(--gray)}
.caret{font-size:12px}
.pop{position:absolute;top:calc(100% + 10px);left:0;width:360px;max-width:86vw;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;box-shadow:0 10px 28px rgba(23,35,28,.18);display:flex;flex-direction:column;gap:2px}
.pop-right{left:auto;right:0}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.pop-t{font-size:15px;font-weight:900}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.pop-row b{font-size:16px}.pop-row .sub{font-size:13px;color:var(--mut)}
.pop-row .rr{display:flex;align-items:center;gap:10px}
.pop-row .days{font-size:14px;font-weight:700}
.pop-empty{padding:10px 0;border-top:1px solid var(--line2);color:var(--mut);font-size:15px}
.pop-f{display:flex;gap:8px;margin-top:8px}
.pop-f .btn-soft{flex:1}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:12px}
.tab{flex:1 1 220px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 20px;border-radius:14px;background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}
.tab b{font-size:20px}.tab span{font-size:14px;color:var(--mut)}
.tab[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-current="page"] span{color:#C9D6CD}

/* banners */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;padding:14px 18px;font-size:16px}
.banner b{font-size:18px}
.banner-red{background:var(--rbg);color:var(--rtx);border:2px solid var(--r)}
.banner-red b{color:var(--r)}
.banner-yellow{background:var(--ybg);color:var(--note)}
.banner-green{background:var(--gbg);color:var(--ink2)}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* type */
.h1{margin:0;font-size:34px;font-weight:900}
.lead{margin:0;font-size:18px;color:var(--mut)}
.h2{font-size:22px;font-weight:700}
.h3{font-size:18px;font-weight:700}
.titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stat{flex:1 1 220px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.stat .l{font-size:15px;color:var(--mut)}
.stat .v{font-size:34px;font-weight:900;line-height:1.15}
.stat .s{font-size:14px;color:var(--mut)}
.stat.good{background:var(--gbg);border-color:var(--gbg)}.stat.good .l,.stat.good .s{color:var(--ink2)}.stat.good .v{color:var(--g)}
.stat.bad{background:var(--rbg);border-color:var(--rbg)}.stat.bad .l,.stat.bad .s{color:var(--rtx)}.stat.bad .v{color:var(--r)}

/* inputs & buttons */
.inp{width:100%;border:1.5px solid var(--ib);border-radius:10px;padding:11px 13px;font-size:17px;background:#fff;min-height:46px}
.inp:focus{outline:3px solid #9CC9AE;outline-offset:0;border-color:var(--g)}
.inp::placeholder{color:#8C9A91}
.inp.sm{padding:8px 10px;min-height:42px}
.inp.num{text-align:right}
.inp.big{font-size:30px;font-weight:900;padding:6px 14px;width:170px}
select.inp{padding-right:8px}
.unit{display:flex;align-items:center;gap:6px}
.unit > span{color:var(--mut);font-size:15px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;min-height:46px}
.btn-dark{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;min-height:44px}
.btn-soft{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
.btn-add{background:var(--o);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;min-height:48px}
.btn-line{background:#fff;border:1.5px solid var(--ib);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;min-height:44px}
.btn-sm{background:#fff;border:1.5px solid var(--ib);border-radius:10px;padding:5px 12px;font-weight:700;font-size:14px}
.btn-rebuy{background:#fff;border:1.5px solid var(--o);color:var(--otx);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;min-height:42px}
.btn-del{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:15px;padding:8px 6px;min-height:42px}
.btn-del:hover{color:var(--r)}
.btn-red{background:var(--r);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:16px;min-height:46px}
.seg{display:flex;gap:4px}
.seg button{border:0;padding:8px 10px;border-radius:8px;font-size:15px;font-weight:500;background:var(--chip);color:var(--ink2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.nav{display:flex;align-items:center;gap:10px}
.navb{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px;font-weight:700}
.navl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 22px;font-size:20px;font-weight:700}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:16px;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--ink)}

/* tables */
.tw{overflow-x:auto;position:relative}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:14px;font-weight:500;color:var(--mut);padding:0 8px 10px;white-space:nowrap}
table.t td{padding:6px 8px;vertical-align:middle}
table.t tbody tr+tr td{border-top:1px solid var(--line2)}
table.t.plain tbody tr+tr td{border-top:0}
table.t td.r,table.t th.r{text-align:right}
table.t tfoot td{border-top:2px solid var(--line);padding-top:12px;font-weight:700}
.hint{font-size:13px;color:var(--mut);margin-top:3px}
.hint.err{color:var(--r);font-weight:700}
.cell-bad{background:var(--rbg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.tag-red{background:var(--rbg);color:var(--r)}

/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
.st .dot{width:9px;height:9px;border-radius:50%}
.st-red{background:var(--rbg);color:var(--r)}.st-red .dot{background:var(--r)}
.st-yellow{background:var(--ybg);color:var(--ytx)}.st-yellow .dot{background:var(--ytx)}
.st-green{background:var(--gbg);color:var(--g)}.st-green .dot{background:var(--g)}
.st-gray{background:var(--graybg);color:var(--gray)}.st-gray .dot{background:var(--gray)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px;color:var(--mut)}

/* stock cards */
.scards{display:flex;flex-direction:column;gap:12px}
.scard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.scard.lv-red{border:2px solid var(--r)}
.scard.lv-yellow{border:2px solid var(--y)}
.sc-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sc-name{font-size:19px;font-weight:700}
.sc-days{font-size:16px;font-weight:700}
.sc-sp{flex:1}
.sc-fields{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:0 0 150px;display:flex;flex-direction:column;gap:4px}
.fld.wide{flex:1 1 320px}
.fld label,.fld .lb{font-size:13px;color:var(--mut)}
.fld .hint{min-height:18px}
.mine{color:var(--o);font-weight:700}

/* guide boxes */
.guide{background:var(--rbg);border:2px solid var(--r);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.guide .gt{font-size:20px;font-weight:900;color:var(--r)}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--r);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.step .tx{font-size:17px;font-weight:700;color:var(--r);line-height:1.5}
.ex{background:#fff;border-radius:10px;padding:12px 16px;font-size:16px;line-height:1.6}
.help{flex:1 1 320px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.help .ht{font-size:18px;font-weight:700}
.help .hb{font-size:16px;color:var(--ink2);line-height:1.6}
.notes{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--mut);line-height:1.55}
.notes span::before{content:"· "}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--rbg);border-radius:12px;padding:12px 14px;color:var(--rtx);font-size:15px;font-weight:500}
.warnbox .ic{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--r);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.okbox{background:var(--gbg);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:15px}

/* menu screen */
.menu-list{flex:0 0 240px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.menu-list .ml{padding:14px 16px;border-radius:12px;background:var(--bg);border:0;font-size:18px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:normal}
.menu-list .ml[aria-current="true"]{background:var(--ink);color:#fff;font-weight:700}
.menu-list .ml .tag-red{flex:0 0 auto}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:10px}
.mhead b{font-size:18px}
.calc{display:flex;flex-direction:column;gap:6px;font-size:16px}
.calc > div{display:flex;justify-content:space-between;gap:10px}
.calc .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:900;font-size:18px}

/* today / month */
.hero{border-radius:22px;padding:28px 32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.hero.good{background:var(--gbg)}.hero.bad{background:var(--rbg)}
.hero .hl{flex:1 1 300px;display:flex;flex-direction:column;gap:6px}
.hero .hlab{font-size:17px;font-weight:500}
.hero.good .hlab,.hero.good .hs{color:var(--ink2)}.hero.bad .hlab,.hero.bad .hs{color:var(--rtx)}
.hero .hv{font-size:58px;font-weight:900;line-height:1.1}
.hero.good .hv{color:var(--g)}.hero.bad .hv{color:var(--r)}
.hero .hs{font-size:15px}
.hero .hbox{flex:1 1 380px;background:#fff;border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.hbox > div{display:flex;justify-content:space-between;gap:12px}
.hbox .m{color:var(--mut)}
.hbox .foot{border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--mut);display:block}
.bar{position:relative;height:16px;border-radius:999px;background:var(--gbar)}
.bar .fill{height:16px;border-radius:999px;background:var(--g)}
.hero.bad .bar{background:#F2C9C1}.hero.bad .bar .fill{background:var(--r)}
.bar .mark{position:absolute;top:-6px;width:3px;height:28px;background:var(--ink)}
.barlbl{position:relative;height:22px;font-size:14px;color:var(--ink2)}
.barlbl span{position:absolute;white-space:nowrap}
.stack{display:flex;gap:2px;height:44px;border-radius:10px;overflow:hidden;background:var(--line2)}
.lg{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:16px}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.dayclosed{background:var(--graybg);color:var(--gray);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700}
.linkbtn{background:none;border:0;padding:4px 0;text-decoration:underline;font-size:inherit;color:var(--ink2)}

/* dialog / toast */
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(23,35,28,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg .dt{font-size:22px;font-weight:900}
.dlg .ds{font-size:15px;color:var(--mut)}
.dlg .dfs{display:flex;flex-direction:column;gap:12px}
.dlg label{font-size:15px;font-weight:700;display:block;margin-bottom:4px}
.preview{background:var(--gbg);border-radius:12px;padding:14px 16px}
.preview .pv{font-size:28px;font-weight:900;color:var(--g)}
.preview .ps{font-size:14px;color:var(--ink2)}
.dacts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;font-size:16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:100;max-width:92vw}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.toast[hidden]{display:none}
.adj-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.adj-row .nm{flex:1;font-weight:700}
.adj-row .inp{width:150px}
.adj-list{max-height:52vh;overflow:auto}
@media (max-width:640px){
  .wrap{padding:16px 16px 56px}
  .h1{font-size:28px}
  .hero{padding:20px}
  .hero .hv{font-size:44px}
  .menu-list{flex:1 1 100%}
}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="logo">모두의장부</div><p class="lead">장부를 여는 중이에요…</p></div></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============ 유틸 ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const pdate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + n); return dstr(d); };
const monthOf = s => s.slice(0, 7);
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysInMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const monthDates = m => Array.from({ length: daysInMonth(m) }, (_, i) => `${m}-${pad(i + 1)}`);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const dLabel = s => { const d = pdate(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
const mLabel = m => `${m.slice(0, 4)}년 ${Number(m.slice(5))}월`;
const mmdd = s => `${s.slice(5, 7)}/${s.slice(8, 10)}`;
const num = v => { if (v == null) return null; const s = String(v).replace(/,/g, '').trim(); if (!s) return null; const m = s.match(/-?\d*\.?\d+/); return m ? Number(m[0]) : null; };
const won = n => Math.round(n || 0).toLocaleString('ko-KR');
const W = n => won(n) + '원';
const SW = n => { const r = Math.round(n || 0); return (r > 0 ? '+' : r < 0 ? '−' : '') + won(Math.abs(r)) + '원'; };
const MW = n => { const r = Math.round(n || 0); return (r < 0 ? '−' : '') + won(Math.abs(r)) + '원'; };
const fmtQ = (n, d = 1) => (n == null || !isFinite(n)) ? '' : (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('ko-KR', { maximumFractionDigits: d });
const fmtS = n => Math.abs(n) >= 10 ? fmtQ(n, 0) : fmtQ(n, 1);
const unitFmt = p => p >= 100 ? won(p) : fmtQ(p, p < 1 ? 2 : 1);
const josa = (w, a, b) => { const c = String(w || '').trim().slice(-1).charCodeAt(0); if (c >= 0xAC00 && c <= 0xD7A3) return w + ((c - 0xAC00) % 28 ? a : b); return w + a + '(' + b + ')'; };
const ceilTo = (n, s) => Math.ceil(n / s) * s;

/* ============ 단위 ============ */

  const fr = r.fixed ? r.fixedShown / r.fixed : 0;
  for (const f of S.fixedCosts) { const a = fixedAmount(f, M) * fr; const n = f.name || ''; if (/임대|월세|관리비/.test(n)) groups['임대료'] += a; else if (/인건|4대|급여|알바|보험/.test(n)) groups['인건비'] += a; else if (/전기|수도|가스|공과/.test(n)) groups['공과금'] += a; else groups['기타 매달 나가는 돈'] += a; }
  const segs = [['재료비', r.ing, '#C2410C'], ['임대료', groups['임대료'], '#1E3A5F'], ['인건비', groups['인건비'], '#3F7CAC'], ['공과금', groups['공과금'], '#A9C4DD'], ['기타 매달 나가는 돈', groups['기타 매달 나가는 돈'], '#6B7280'], ['수수료·배달비', r.fees, '#7B4E8E'], ['쓴 돈', r.expenses, '#B8B0A2'], ['리뷰 이벤트', r.review, '#B45309']];
  if (r.netShown > 0) segs.push(['남는 돈', r.netShown, '#137A4B']);
  const tot = Math.max(r.revenue, segs.reduce((a, s) => a + s[1], 0), 1);
  const rank = S.menus.map(m => ({ m, e: r.menus[m.id] || { qty: 0, sales: 0, cost: 0 } })).sort((a, b) => b.e.qty - a.e.qty);
  const computed = r.ing + r.reviewIng;

  const bd = businessDays(M);
  return `<div class="titlebar"><h1 class="h1">이번 달에 얼마 남았을까요?</h1>

<div class="col" style="gap:4px"><span class="hlab">이번 달 남는 돈</span><span class="hv" style="font-size:68px">${MW(r.netShown)}</span>${cur ? `<span class="hs">오늘까지 기준이에요</span>` : ''}</div>
<div class="col" style="gap:4px;text-align:right"><span class="hlab">${r.breakEven ? (r.revenue >= r.breakEven ? `본전 매출 ${W(r.breakEven)}을 넘었어요` : `본전 매출 ${W(r.breakEven)}까지 ${W(r.breakEven - r.revenue)} 남았어요`) : '매달 나가는 돈을 적으면 본전 매출을 알려드려요'}</span><span class="hs">하루 평균 매출 ${W(r.daysWithSales ? r.revenue / r.daysWithSales : 0)}${cur ? ` · 오늘까지 ${days}일째` : ''}</span></div>
</div>
${r.breakEven ? `<div class="col" style="gap:8px"><div class="bar"><div class="fill" style="width:${Math.min(100, r.revenue / max * 100)}%"></div><div class="mark" style="left:${r.breakEven / max * 100}%"></div></div>

const fsSupported = 'showSaveFilePicker' in window;

function idb() {
  if (!dbp) dbp = new Promise((res, rej) => { try { const r = indexedDB.open('modu-jangbu', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });

}
async function kvGet(k) { try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch { return undefined; } }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch { return false; } }

/* ============ 수수료 기본값 자동 확인 (한 달에 한 번) ============ */
async function checkRates() {
  const last = S.settings.ratesCheckedAt;
  if (last && Date.now() - Date.parse(last) < 30 * 864e5) return;
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch('rates.json', { cache: 'no-store' }); if (!r.ok) return;
    const j = await r.json(); if (!j || !j.channels) return;
    S.settings.ratesCheckedAt = new Date().toISOString();
    if (j.version && j.version === S.settings.ratesVersion) { scheduleSave(); return; }
    const changes = [];
    for (const [id, vals] of Object.entries(j.channels)) {
      const ch = findCh(id); if (!ch) continue;
      for (const f of ['app', 'pay', 'fee']) {
        if (vals[f] == null || Number(vals[f]) === num(ch[f])) continue;
        if (ch.edited?.[f]) changes.push({ id, f, old: num(ch[f]), nw: Number(vals[f]), applied: false });
        else { changes.push({ id, f, old: num(ch[f]), nw: Number(vals[f]), applied: true }); ch[f] = Number(vals[f]); }
      }
    }
    const first = !S.settings.ratesVersion;
    S.settings.ratesVersion = j.version || null;
    if (changes.length && !first) S.rateNotice = { version: j.version, changes };
    C = {}; scheduleSave(); render();
  } catch {}
}

/* ============ 시작 ============ */
async function boot() {
  const raw = await kvGet('ledger');
  let data = raw ? safeParse(raw) : null;
  try { fileHandle = (await kvGet('fileHandle')) || null; } catch { fileHandle = null; }
  if (fileHandle) {
    try {
      if ((await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted') {
        const fd = safeParse(await (await fileHandle.getFile()).text());
        if (fd && Array.isArray(fd.menus) && (!data || (fd.savedAt || '') > (data.savedAt || ''))) data = fd;
        fileState = 'ok';
      } else fileState = 'lost';
    } catch { fileState = 'lost'; }
  }
  S = migrate(data || seedState());
  if (!data) { S.savedAt = new Date().toISOString(); ui.idbOk = await kvSet('ledger', JSON.stringify(S)); }
  render();
  checkRates();
  // 자정이 지나면 날짜를 넘긴다
  setInterval(() => { const t = today(); if (ui.lastToday && ui.lastToday !== t) { if (ui.date === ui.lastToday) ui.date = t; if (ui.month === monthOf(ui.lastToday)) ui.month = monthOf(t); C = {}; render(); } ui.lastToday = t; }, 60000);
  ui.lastToday = today();
}
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S && ui.saving) saveNow(); });
boot();
</script>
